name: Pylint

on: [push, pull_request]

jobs:
  pylint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Оставили только самые свежие версии Python
        python-version: ["3.13", "3.14"]
      # fail-fast: false позволяет увидеть результаты для обеих версий, 
      # даже если одна из них упадет. Если хотите экономить ресурсы — замените на true.
      fail-fast: false 

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Pylint
      run: |
        python -m pip install --upgrade pip
        pip install pylint

    - name: Analysing the code with pylint
      run: |
        FILES=$(git ls-files '*.py')
        if [ -n "$FILES" ]; then
          # --jobs=0 включает параллельный анализ на всех доступных ядрах процессора,
          # что значительно ускоряет проверку и тратит меньше платных минут GitHub.
          pylint --jobs=0 $FILES
        else
          echo "Python-файлы не найдены."
        fi
