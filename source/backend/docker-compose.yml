services:
  # ===================================================================
  # БАЗЫ ДАННЫХ (по одной на каждый сервис)
  # ===================================================================
  auth-db:
    image: postgres:16-alpine
    container_name: vuzhub-auth-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${AUTH_DB_NAME:-vuzhub_auth}
    ports:
      - "${AUTH_DB_PORT:-5432}:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - mynet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  study-db:
    image: postgres:16-alpine
    container_name: vuzhub-study-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${STUDY_DB_NAME:-vuzhub_study}
    ports:
      - "${STUDY_DB_PORT:-5433}:5432"
    volumes:
      - study_db_data:/var/lib/postgresql/data
    networks:
      - mynet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  finance-db:
    image: postgres:16-alpine
    container_name: vuzhub-finance-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${FINANCE_DB_NAME:-vuzhub_finance}
    ports:
      - "${FINANCE_DB_PORT:-5434}:5432"
    volumes:
      - finance_db_data:/var/lib/postgresql/data
    networks:
      - mynet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  integration-db:
    image: postgres:16-alpine
    container_name: vuzhub-integration-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${INTEGRATION_DB_NAME:-vuzhub_integration}
    ports:
      - "${INTEGRATION_DB_PORT:-5435}:5432"
    volumes:
      - integration_db_data:/var/lib/postgresql/data
    networks:
      - mynet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================================
  # REDIS (общий кэш для всех сервисов)
  # ===================================================================
  redis:
    image: redis:7-alpine
    container_name: vuzhub-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - mynet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================================
  # СЕРВИСЫ (бэкенд)
  # ===================================================================
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vuzhub-auth-service
    env_file:
      - .env.auth
    environment:
      SERVICE_NAME: auth-service
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: ${AUTH_DB_NAME:-vuzhub_auth}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mynet
    restart: unless-stopped

  study-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vuzhub-study-service
    env_file:
      - .env.study
    environment:
      SERVICE_NAME: study-service
      DB_HOST: study-db
      DB_PORT: 5432
      DB_NAME: ${STUDY_DB_NAME:-vuzhub_study}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: "8002"
    ports:
      - "8002:8002"
    depends_on:
      study-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mynet
    restart: unless-stopped

  finance-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vuzhub-finance-service
    env_file:
      - .env.finance
    environment:
      SERVICE_NAME: finance-service
      DB_HOST: finance-db
      DB_PORT: 5432
      DB_NAME: ${FINANCE_DB_NAME:-vuzhub_finance}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: "8003"
    ports:
      - "8003:8003"
    depends_on:
      finance-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mynet
    restart: unless-stopped

  integration-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vuzhub-integration-service
    env_file:
      - .env.integration
    environment:
      SERVICE_NAME: integration-service
      DB_HOST: integration-db
      DB_PORT: 5432
      DB_NAME: ${INTEGRATION_DB_NAME:-vuzhub_integration}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: "8004"
    ports:
      - "8004:8004"
    depends_on:
      integration-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mynet
    restart: unless-stopped

  # ===================================================================
  # API GATEWAY (опционально, nginx reverse proxy)
  # ===================================================================
  # api-gateway:
  #   image: nginx:alpine
  #   container_name: vuzhub-gateway
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - auth-service
  #     - study-service
  #     - finance-service
  #     - integration-service
  #   networks:
  #     - mynet
  #   restart: unless-stopped

networks:
  mynet:
    driver: bridge

volumes:
  auth_db_data:
  study_db_data:
  finance_db_data:
  integration_db_data:
