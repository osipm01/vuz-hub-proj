global
    log stdout format raw local0
    maxconn 4096
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    retries 3

# ===================================================================
# FRONTEND — порт, на который слушает HAProxy (клиент подключается сюда)
# ===================================================================
frontend vuzhub
    bind *:80
    # TODO: дописать rules / ACL / HTTPS когда будешь готов
