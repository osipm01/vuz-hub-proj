global
    log stdout format raw local0
    maxconn 4096
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    retries 3

# ===================================================================
# FRONTEND — порт, на который слушает HAProxy (клиент подключается сюда)
# ===================================================================
frontend vuzhub
    bind *:80

    # --- API-префиксы (прямые и /api/*) ---
    acl path_auth      path_beg /auth /api/auth
    acl path_users     path_beg /users /api/users
    acl path_groups    path_beg /groups /api/groups
    acl path_schedules path_beg /schedules /api/schedules
    acl path_subjects  path_beg /subjects /api/subjects
    acl path_debts     path_beg /debts /api/debts
    acl path_dops      path_beg /dops /api/dops
    acl path_user_subj path_beg /user-subjects /api/user-subjects
    acl path_integrat  path_beg /integrations /api/integrations

    # Всё, что НЕ API — клиент (SPA / статика / корень)
    acl is_api path_beg /auth /users /groups /schedules /subjects /debts /dops /user-subjects /integrations /api

    use_backend auth_backend        if path_auth path_users
    use_backend study_backend       if path_groups path_schedules path_subjects path_user_subj
    use_backend finance_backend     if path_debts path_dops
    use_backend integration_backend if path_integrat
    use_backend client_backend      if !is_api

    default_backend auth_backend    # fallback (на случай, если is_api не сработал)

# ===================================================================
# BACKEND — бэкенды (сервисы), которые HAProxy будет балансировать
# ===================================================================
backend auth_backend
    balance roundrobin
    server auth-service vuzhub-auth-service:8001 check

backend study_backend
    balance roundrobin
    server study-service vuzhub-study-service:8002 check

backend finance_backend
    balance roundrobin
    server finance-service vuzhub-finance-service:8003 check

backend integration_backend
    balance roundrobin
    server integration-service vuzhub-integration-service:8004 check

backend client_backend
    balance roundrobin
    server client-app client:3000 check

# ===================================================================
# STATISTICS
# ===================================================================
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
