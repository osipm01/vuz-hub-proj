[package]
name = "proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["full"] } # Утилиты для hyper 1.0 (рантайм, коннекторы)
http-body-util = "0.1" # Для работы с телом запроса/ответа
serde = { version = "1.0", features = ["derive"] }
toml = "0.8" # Или json, для конфига
