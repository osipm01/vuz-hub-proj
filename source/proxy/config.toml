# Адрес, на котором слушает прокси
listen = "127.0.0.1:8080"

# Таймаут ожидания ответа (заголовков) от upstream, секунды
upstream_timeout_secs = 30

# ---------------------------------------------------------------- auth-service
# /auth/...  ->  http://127.0.0.1:8001/...
[[routes]]
prefix = "/auth"
upstream = "http://127.0.0.1:8001"
strip_prefix = true

# --------------------------------------------------------------- study-service
# /study/... ->  http://127.0.0.1:8002/...
[[routes]]
prefix = "/study"
upstream = "http://127.0.0.1:8002"
strip_prefix = true

# ---------------------------------------------------------------- fallback
# Всё остальное -> auth-service (или можно перенаправить на study-service,
# либо вовсе убрать этот маршрут, чтобы отдавать 404)
[[routes]]
prefix = "/"
upstream = "http://127.0.0.1:8000"
strip_prefix = false
